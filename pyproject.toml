[project]
name = "gpu-faults"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "modal>=1.6.2",
    "modal-lib",
    "numpy>=2.5.4",
    "torch>=2.11.0",
]

[tool.uv.sources]
modal-lib = { git = "https://github.com/crsmithdev/modal-lib", rev = "2c2769a" }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
